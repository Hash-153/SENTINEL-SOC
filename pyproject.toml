[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-nids-siem"
version = "1.0.0"
description = "Enterprise Network Intrusion Detection & SIEM Security Platform"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Security Engineering Team", email = "sec-ops@internal.corp" }
]
dependencies = []

[project.scripts]
sentinel = "sentinel.daemon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
